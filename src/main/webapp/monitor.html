<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor</title>
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 24px;
        background: #14161a;
        color: #e6e8ec;
        font-family: "Segoe UI", Tahoma, sans-serif;
        font-size: 14px;
    }

    h1 {
        font-size: 18px;
        font-weight: 600;
        margin: 0 0 24px 0;
        color: #9aa3b2;
        letter-spacing: 0.5px;
    }

    /* ---------- one block per server ---------- */

    .server {
        margin-bottom: 28px;
    }

    .server-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-bottom: 10px;
        border-bottom: 1px solid #262a31;
        margin-bottom: 14px;
    }

    .server-name {
        font-size: 15px;
        font-weight: 600;
    }

    .server-url {
        font-size: 12px;
        color: #6b7280;
        margin-left: auto;
    }

    .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex-shrink: 0;
    }

    .dot.active   { background: #2ecc71; box-shadow: 0 0 8px rgba(46,204,113,.5); }
    .dot.inactive { background: #4b5563; }

    /* ---------- service cards ---------- */

    .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 12px;
    }

    .card {
        background: #1c1f25;
        border: 1px solid #262a31;
        border-radius: 8px;
        padding: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
    }

    .card-name {
        font-size: 13px;
        font-weight: 500;
    }

    .card-key {
        font-size: 11px;
        color: #6b7280;
        margin-top: 4px;
    }

    .info-icon {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 1px solid #4b5563;
        color: #9aa3b2;
        font-size: 11px;
        font-weight: 700;
        line-height: 16px;
        text-align: center;
        cursor: help;
        flex-shrink: 0;
        user-select: none;
    }

    .info-icon:hover {
        border-color: #3b82f6;
        color: #3b82f6;
    }

    /* ---------- tooltip ---------- */

    .tooltip {
        position: fixed;
        display: none;
        max-width: 320px;
        background: #0f1115;
        border: 1px solid #333842;
        border-radius: 6px;
        padding: 10px 12px;
        box-shadow: 0 6px 20px rgba(0,0,0,.5);
        z-index: 50;
        pointer-events: none;
    }

    .tooltip-head {
        font-size: 12px;
        font-weight: 600;
        color: #e6e8ec;
        margin-bottom: 6px;
    }

    .tooltip-desc {
        font-size: 12px;
        color: #9aa3b2;
        line-height: 1.5;
    }

    /* ---------- states ---------- */

    .message {
        color: #6b7280;
        padding: 20px 0;
    }

    .message.error {
        color: #ef4444;
    }
</style>
</head>
<body>

<h1>SERVERS MONITOR</h1>

<!-- your JS fills this container -->
<div id="servers">
    <div class="message">loading...</div>
</div>

<!-- one shared tooltip, moved and filled by your JS -->
<div class="tooltip" id="tooltip">
    <div class="tooltip-head" id="tooltip-head"></div>
    <div class="tooltip-desc" id="tooltip-desc"></div>
</div>

<script src="monitor.js"></script>
</body>
</html>
